<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHROME FC</title>
<style>
  :root{
    --ink:#15151c;
    --soft:#6a6a82;
    --faint:#9b9bb5;
    --line:#dededf;
    --line2:#d4d2ea;
    --peri:#6b6bd6;
    --bg1:#e7e6f5;
    --bg2:#f3f2fb;
    --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 90% at 50% -8%, #d9d7f4 0%, rgba(217,215,244,0) 46%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 30%, #ffffff 78%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}

  /* top announcement */
  .ann{
    text-align:center; font-size:10.5px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--soft); padding:9px 0; border-bottom:1px solid rgba(0,0,0,.05);
  }

  /* nav */
  .nav{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:16px 26px; gap:14px;
  }
  .nav .menu{display:flex; gap:18px; font-size:12px; letter-spacing:.04em; color:var(--soft);}
  .nav .menu a:hover{color:var(--ink);}
  .nav .menu .ico{filter:saturate(1.1);}
  .nav .right{justify-self:end; display:flex; gap:16px; font-size:12px; letter-spacing:.08em; color:var(--soft);}
  .brand{
    justify-self:center; font-weight:800; font-size:clamp(17px,2.4vw,22px); letter-spacing:.06em;
    background:linear-gradient(180deg,#ffffff,#cfd6e6 42%,#7d8aa6 52%,#e9edf6 72%,#9aa6c2);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 1px 0 rgba(40,55,95,.25));
  }
  @media(max-width:760px){ .nav{grid-template-columns:auto 1fr auto;} .nav .menu{display:none;} }

  /* hero + globe */
  .hero{ text-align:center; padding:30px 20px 18px; }
  .globe-wrap{ display:grid; place-items:center; perspective:700px; }
  .globe{
    width:clamp(150px,26vw,250px); aspect-ratio:1; border-radius:50%; position:relative;
    overflow:hidden; isolation:isolate;
    background:radial-gradient(circle at 33% 27%, #f0f6ff 0%, #b7d2f4 18%, #6ea0e0 44%, #3568b8 70%, #16356f 100%);
    box-shadow:
      inset -16px -20px 44px rgba(8,22,60,.6),
      inset 12px 14px 30px rgba(255,255,255,.55),
      0 22px 60px rgba(58,96,180,.4);
    animation:bob 6s ease-in-out infinite;
  }
  .globe::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background-image:
      repeating-linear-gradient(90deg, rgba(225,240,255,.55) 0 1.5px, transparent 1.5px 24px),
      repeating-linear-gradient(0deg,  rgba(210,232,255,.38) 0 1.5px, transparent 1.5px 24px);
    -webkit-mask:radial-gradient(circle at 50% 50%, #000 58%, transparent 73%);
            mask:radial-gradient(circle at 50% 50%, #000 58%, transparent 73%);
    animation:spin 7s linear infinite;
  }
  .globe::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 30% 23%, rgba(255,255,255,.9), rgba(255,255,255,0) 32%);
    mix-blend-mode:screen; z-index:2;
  }
  .ring{
    position:absolute; inset:-14% ; border-radius:50%;
    border:1px solid rgba(120,140,210,.4);
    transform:rotateX(74deg); pointer-events:none;
  }
  @keyframes spin{ to{ background-position:-240px 0, 0 0; } }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @media(prefers-reduced-motion:reduce){ .globe,.globe::before{animation:none;} }

  .hero h1{
    margin:22px 0 8px; font-size:clamp(30px,7vw,68px); line-height:.95; letter-spacing:-.02em;
    font-weight:800; text-transform:uppercase;
  }
  .hero p{
    margin:0 auto; max-width:34ch; color:var(--soft);
    font-size:clamp(12px,1.6vw,15px); letter-spacing:.05em; text-transform:uppercase;
  }

  /* grid */
  .label{ text-align:center; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--faint); padding:46px 0 26px; }
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px 14px;
    max-width:1080px; margin:0 auto; padding:0 22px 30px;
  }
  @media(max-width:860px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .card{ text-align:center; cursor:pointer; padding:14px 10px 22px; border-radius:18px; transition:background .25s; }
  .card:hover{ background:rgba(255,255,255,.5); }
  .thumb{
    position:relative; aspect-ratio:1/1; border-radius:16px; overflow:hidden;
    background:radial-gradient(120% 120% at 30% 20%, #ffffff, #eef0fb 60%, #e4e5f5);
    display:grid; place-items:center; box-shadow:inset 0 0 0 1px rgba(120,120,170,.12);
  }
  .thumb .glow{position:absolute; inset:0; opacity:.18;}
  .thumb .flag{font-size:clamp(56px,9vw,104px); filter:drop-shadow(0 6px 14px rgba(40,40,90,.25)); transition:transform .4s ease;}
  .card:hover .thumb .flag{transform:scale(1.07) rotate(-2deg);}
  .thumb .ph{
    position:absolute; top:10px; right:10px; font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--faint); background:#fff; border:1px solid var(--line); padding:3px 7px; border-radius:999px;
  }
  .name{ margin-top:16px; font-size:14px; font-weight:600; letter-spacing:.01em; }
  .sub{ font-size:11px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase; margin-top:3px; }
  .price{ font-size:13px; margin-top:6px; }
  .sizes{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .sizes span{
    font-size:11px; letter-spacing:.06em; min-width:30px; padding:6px 4px; border:1px solid var(--line2);
    border-radius:7px; background:#fff; color:var(--soft); transition:.15s;
  }
  .card:hover .sizes span:hover{ border-color:var(--ink); color:var(--ink); }

  footer{ text-align:center; padding:54px 24px 72px; color:var(--faint); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; }
  footer .fc{ font-weight:800; color:var(--ink); letter-spacing:.08em; font-size:13px; margin-bottom:10px; }

  /* sheet */
  .overlay{ position:fixed; inset:0; background:rgba(30,28,60,.4); backdrop-filter:blur(4px); display:none; z-index:60; justify-content:flex-end; }
  .overlay.open{display:flex;}
  .sheet{ width:min(500px,100%); height:100%; overflow-y:auto; background:linear-gradient(180deg,#f6f5fc,#fff 30%); padding:24px 26px 44px; animation:slide .28s ease; }
  @keyframes slide{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .x{float:right; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); background:none; border:none; cursor:pointer;}
  .sheet .big{ aspect-ratio:1/1; border-radius:18px; overflow:hidden; margin-top:22px; display:grid; place-items:center;
    background:radial-gradient(120% 120% at 30% 20%, #fff, #eef0fb 60%, #e4e5f5); box-shadow:inset 0 0 0 1px rgba(120,120,170,.12); position:relative;}
  .sheet .big .flag{font-size:clamp(90px,20vw,150px); filter:drop-shadow(0 8px 18px rgba(40,40,90,.25));}
  .sheet h2{margin:22px 0 3px; font-size:20px; font-weight:700; text-transform:uppercase; letter-spacing:.01em;}
  .sheet .ssub{color:var(--faint); font-size:11px; letter-spacing:.14em; text-transform:uppercase;}
  .sheet .pr{font-size:17px; margin:14px 0 16px;}
  .pick{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .pick button{font-family:inherit; font-size:12px; letter-spacing:.08em; padding:9px 15px; border:1px solid var(--line2); background:#fff; border-radius:9px; cursor:pointer;}
  .pick button.sel{border-color:var(--ink); background:var(--ink); color:#fff;}
  .mount{border-top:1px solid var(--line); padding-top:18px;}
  .buy{display:block; width:100%; text-align:center; background:var(--ink); color:#fff; font-family:inherit; font-size:13px; letter-spacing:.2em; text-transform:uppercase; padding:16px; border:none; border-radius:12px; cursor:pointer; margin-top:12px;}
  .buy:hover{opacity:.9;}
  .note{margin-top:12px; font-size:10.5px; color:var(--faint); letter-spacing:.05em; line-height:1.7;}
</style>
</head>
<body>

  <div class="ann">Worldwide shipping · Est. Compton · World Cup national kits</div>

  <nav class="nav">
    <div class="menu">
      <a href="#grid">🌐 Shop</a>
      <a href="#grid">⚽ Kits</a>
      <a href="#">ℹ︎ Info</a>
    </div>
    <a class="brand" href="#">CHROME FC</a>
    <div class="right"><span>SEARCH</span><span>BAG (0)</span></div>
  </nav>

  <header class="hero">
    <div class="globe-wrap">
      <div class="globe"><div class="ring"></div></div>
    </div>
    <h1>World Cup Kits</h1>
    <p>Football jerseys you can wear in Compton</p>
  </header>

  <div class="label" id="grid">The Collection — 5 Kits</div>
  <main class="grid" id="cards"></main>

  <footer>
    <div class="fc">CHROME FC</div>
    Compton, CA · World Cup national kits<br>
    © 2026 Chrome FC — powered by Whop
  </footer>

  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

  <script async defer src="https://js.whop.com/static/checkout/loader.js"></script>
  <script>
    // ── Whop plan ids (live) ──
    const PRODUCTS = [
      { key:"usa",       name:"USA Jersey",       flag:"🇺🇸", price:120, plan:"plan_neYQvYQ4fvxHn", a:"#3c3b6e", b:"#b22234" },
      { key:"mexico",    name:"Mexico Jersey",    flag:"🇲🇽", price:120, plan:"plan_scOsVRtXTjgRP", a:"#006847", b:"#ce1126" },
      { key:"argentina", name:"Argentina Jersey", flag:"🇦🇷", price:130, plan:"plan_ULkzKIourRVfS", a:"#74acdf", b:"#ffffff" },
      { key:"brazil",    name:"Brazil Jersey",    flag:"🇧🇷", price:130, plan:"plan_WHztszc1Wy222", a:"#009b3a", b:"#fedf00" },
      { key:"scotland",  name:"Scotland Jersey",  flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿", price:110, plan:"plan_c9xhCHIg1nJH4", a:"#0065bf", b:"#ffffff" },
    ];
    const SIZES = ["S","M","L","XL"];
    const money = n => "$" + n.toFixed(0);
    const cards = document.getElementById("cards");

    PRODUCTS.forEach(p => {
      const el = document.createElement("article");
      el.className = "card";
      el.innerHTML = `
        <div class="thumb">
          <div class="glow" style="background:linear-gradient(135deg,${p.a},${p.b})"></div>
          <div class="ph">Add design</div>
          <div class="flag">${p.flag}</div>
        </div>
        <div class="name">${p.name}</div>
        <div class="sub">Chrome FC · National Kit</div>
        <div class="price">${money(p.price)}</div>
        <div class="sizes">${SIZES.map(s=>`<span data-s="${s}">${s}</span>`).join("")}</div>`;
      el.querySelectorAll(".sizes span").forEach(s=>{
        s.addEventListener("click", e=>{ e.stopPropagation(); openSheet(p.key, s.dataset.s); });
      });
      el.addEventListener("click", ()=> openSheet(p.key));
      cards.appendChild(el);
    });

    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");

    function openSheet(key, size){
      const p = PRODUCTS.find(x=>x.key===key); if(!p) return;
      size = size || "M";
      const hosted = `https://whop.com/checkout/${p.plan}/`;
      sheet.innerHTML = `
        <button class="x" onclick="closeSheet()">Close ✕</button>
        <div style="clear:both"></div>
        <div class="big"><div class="glow" style="position:absolute;inset:0;opacity:.16;background:linear-gradient(135deg,${p.a},${p.b})"></div><div class="flag">${p.flag}</div></div>
        <h2>${p.name}</h2>
        <div class="ssub">Chrome FC · World Cup National Kit</div>
        <div class="pr">${money(p.price)}</div>
        <div class="pick" id="pick">${SIZES.map(s=>`<button class="${s===size?'sel':''}" data-s="${s}">${s}</button>`).join("")}</div>
        <div class="mount">
          <div data-whop-checkout-plan-id="${p.plan}"></div>
          <a class="buy" href="${hosted}" target="_blank" rel="noopener">Checkout — ${money(p.price)}</a>
          <p class="note">Pick your size in the Whop checkout above. Embedded checkout renders live; the button is the hosted fallback.</p>
        </div>`;
      sheet.querySelectorAll("#pick button").forEach(b=>{
        b.addEventListener("click",()=>{ sheet.querySelectorAll("#pick button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
      });
      overlay.classList.add("open"); document.body.style.overflow="hidden";
      if(history.replaceState) history.replaceState(null,"","#"+key);
      if(window.whopCheckout?.mount){ try{ window.whopCheckout.mount(); }catch(e){} }
    }
    function closeSheet(){ overlay.classList.remove("open"); document.body.style.overflow=""; if(history.replaceState) history.replaceState(null,"","#"); }
    window.closeSheet = closeSheet;
    overlay.addEventListener("click", e=>{ if(e.target===overlay) closeSheet(); });
    document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

    const h = location.hash.replace("#",""); if(h && PRODUCTS.some(p=>p.key===h)) openSheet(h);
  </script>
</body>
</html>
